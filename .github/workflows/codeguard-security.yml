name: CodeGuard security checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Optional comparison commit or ref; defaults to the previous commit
        required: false
        type: string

permissions:
  contents: read

jobs:
  local-security-checks:
    name: Local security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
      DO_NOT_TRACK: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out the change and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned local scanners
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'semgrep==1.176.1'
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/codeguard-gitleaks.tar.gz" \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/codeguard-gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/codeguard-bin"
          tar -xzf "$RUNNER_TEMP/codeguard-gitleaks.tar.gz" -C "$RUNNER_TEMP/codeguard-bin" gitleaks
          echo "$RUNNER_TEMP/codeguard-bin" >> "$GITHUB_PATH"

      - name: Check changes with local rules and redacted secret detection
        env:
          CODEGUARD_BASE_REF: ${{ inputs.base_ref }}
        run: python .github/codeguard/ci-scan.py
